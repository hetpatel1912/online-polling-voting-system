services:
  web:
    build: .
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: campus_vote
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_vote
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-development-only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
